schema_version: 1

experiment:
  id: learned_rgbd_static_obstacles_v1
  display_name: Learned RGB-D action modifier on static obstacles
  status: design_spec_incomplete
  enabled: false
  purpose: paired_empirical_baseline
  blockers:
    - model_artifacts_missing
    - reference_controller_not_implemented
    - observation_and_action_adapters_not_implemented
    - scenario_spec_resolver_not_implemented
    - experiment_orchestrator_not_implemented
    - server_validation_not_run

configuration:
  method: configs/baselines/learned_rgbd/method.yaml
  controller: configs/baselines/learned_rgbd/reference_controller.yaml
  scenario: configs/scenarios/static_obstacles.yaml
  runtime: configs/runtimes/server_ros2.yaml
  artifacts: artifacts/models/manifest.yaml

comparison:
  baseline:
    id: reference_policy
    action_modifier: none
  candidate:
    id: learned_rgbd_modifier
    action_modifier: learned_rgbd
  require_paired_seed_and_initial_state: true

recording:
  run_id_template: "{experiment_id}-{utc_timestamp}-{git_revision}"
  write_config_snapshot: true
  write_git_revision: true
  write_environment_manifest: true
  write_artifact_manifest_snapshot: true
  write_stdout_stderr: true
  per_step_trace:
    enabled: true
    format: parquet
    fields:
      - episode_id
      - seed
      - step
      - timestamp
      - observation_id
      - reference_action
      - final_action
      - intervention_norm
      - cbf_like_score
      - clf_like_score
      - certificate_violation
      - obstacle_distance_m
      - reward
      - cost
      - collision
  per_episode_summary:
    format: jsonl
    fields:
      - episode_id
      - seed
      - termination_reason
      - steps
      - success
      - collision_count
      - minimum_obstacle_distance_m
      - total_reward
      - total_cost
      - intervention_count
      - intervention_rate
      - mean_intervention_norm
      - maximum_intervention_norm
      - certificate_violation_count
      - infeasible_modifier_count

reproducibility:
  seed_source: configs/scenarios/static_obstacles.yaml
  preserve_raw_traces: true
  overwrite_existing_run: false
  resume_partial_run: false
