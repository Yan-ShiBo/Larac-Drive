schema_version: 1
kind: certificate_synthesis_spec
id: G4_G11P49_QSBC_V1

theorem:
  id: G4_QSBC_INFINITE_HORIZON_REACH_AVOID_V1
  unchanged: true
  obligations:
    - W >= 0 on X
    - W <= q on X0
    - W >= 1 on Xu
    - E[W_next] <= W - epsbar on Psi

frozen_inputs:
  model_decision_ids:
    - M1_STOCHASTIC_SINGLE_INTEGRATOR_2D
    - S1_DT005_SPEED_DISK05_NO_POST_CLIP
    - P1_CONSERVATIVE_INFLATED_AABB
    - D1_COMPACT_ROBUST_FORWARD_INVARIANT
    - N1_IID_SYMMETRIC_TRIANGULAR_5MM
  controller_id: CBF_ROVER_C2_LOWER_ROUTE_V1
  controller_content_sha256: b0cacedfcd4b884961a786b24e84b2f0f33bbc4ac81aef0b1ff1b0dcfe285984
  controller_file_sha256: df0dbfd2cc5b3aa0a049b5dbb6e7d0360c6b260801e183e95acfb7a9bccf715d
  controller_validation_id: C2V1_PIECEWISE_BERNSTEIN_AND_1000_ROLLOUTS
  runtime_mode: monitor_only
  certificate_evaluator_modifies_action: false

geometry:
  partition_id: P49_C2_OBSTACLE_ALIGNED_CARTESIAN_V1
  reach_catalog_id: G11P49_ACTION_DISK_QUADRANT_REACH_CATALOG_V1
  catalog_content_sha256: ef545affb1c35d965be5d4b9d9e5ab39854e4d8069c296b924d45e049a88924a
  physical_x_breaks_exact: [-1, 4/5, 193/200, 383/200, 407/200, 617/200, 16/5, 4]
  physical_y_breaks_exact: [-2, -277/200, -107/200, -43/200, 43/200, 107/200, 277/200, 2]
  normalized_x_breaks_exact: [-1, -7/25, -107/500, 83/500, 107/500, 317/500, 17/25, 1]
  normalized_y_breaks_exact: [-1, -277/400, -107/400, -43/400, 43/400, 107/400, 277/400, 1]
  counts:
    cells: 49
    unsafe_cells: 12
    safe_source_cells: 37
    goal_boundary_safe_cells: 3
    internal_conforming_edges: 84
    roofs: 148
    target_intersections_per_quadrant: 253
    target_intersections_total: 1012
  goal_boundary_safe_cell_ids: [C_6_2, C_6_3, C_6_4]
  initial_shape_cell_id: C_0_3
  controller_source_cell_counts:
    lower_entry: 7
    lower_transit: 23
    goal_capture: 7
  reach_padding_normalized_exact:
    action_disk_x: 1/100
    action_disk_y: 1/80
    N1_x_half_width: 1/500
    N1_y_half_width: 1/400
  reach_padding_uses_action_disk_not_observed_controller_range: true

synthesis:
  id: G11P49_C0_BERNSTEIN_ROOF_LP_V1
  proof_route_id: G11P49_C0_PIECEWISE_ROOF_SUFFICIENT_G4_V1
  route: independent_fallback_beside_global_polynomial_routes
  solver: SciPy_HiGHS
  matrix_format: CSR
  global_dense_matrix_allowed: false
  objective: maximize_common_rho_with_q_fixed
  rho_bounds: [-1.0, 1.0]
  q:
    decimal: 0.09999999999999999
    float64_hex: 0x1.9999999999999p-4
    exact_binary64_is_no_greater_than_one_tenth: true
  epsbar:
    decimal: 0.000001
    float64_hex: 0x1.0c6f7a0b5ed8dp-20
    semantics: exact_binary64_artifact_value
  barrier:
    basis: local_tensor_bernstein
    continuity: C0_by_shared_global_control_net
    coefficient_bounds: [-1000.0, 1000.0]
  roofs:
    one_per_safe_source_cell_and_N1_quadrant: true
    basis: local_tensor_bernstein_on_action_disk_reach_box
    coefficient_bounds: [-1000.0, 1000.0]
    quadrant_order: [[-1, -1], [-1, 1], [1, -1], [1, 1]]
    half_triangular_moment: "m_n^sigma(a)=sigma^n*a^n/((n+1)*(n+2))"
  shape_multipliers:
    basis: local_tensor_bernstein
    coefficient_bounds: [0.0, 100000.0]
    count: 4
    guards:
      - initial_disk_on_C_0_3
      - goal_exterior_on_C_6_2
      - goal_exterior_on_C_6_3
      - goal_exterior_on_C_6_4
  sufficient_constraints:
    - W nonnegative on every P49 cell
    - q-W minus initial shape multiplier is nonnegative on C_0_3
    - W-1 is nonnegative on all 12 unsafe cells
    - each roof dominates every target W piece on each positive-area reach intersection
    - W-epsbar-sum_quadrant_exact_roof_expectations is nonnegative on Psi
  controller_switch_semantics: validate_both_adjacent_source_cell_closures
  finite_schedule:
    - stage_id: P49_W3_R4_M2
      barrier_degree: 3
      roof_degree: 4
      multiplier_degree: 2
      variables: 4221
      linear_inequalities: 27666
      time_limit_s: 3600
    - stage_id: P49_W4_R6_M2
      barrier_degree: 4
      roof_degree: 6
      multiplier_degree: 2
      variables: 8130
      linear_inequalities: 54121
      time_limit_s: 7200
    - stage_id: P49_W4_R6_M4
      barrier_degree: 4
      roof_degree: 6
      multiplier_degree: 4
      variables: 8194
      linear_inequalities: 54145
      time_limit_s: 14400
  resource_caps:
    max_RSS_bytes: 8589934592
    max_CSR_nonzeros: 5000000
  highs:
    presolve: true
    primal_feasibility_tolerance: 1.0e-9
    dual_feasibility_tolerance: 1.0e-9
  first_validated_stage_stops_schedule: true
  escalation_beyond_schedule_allowed: false
  all_stages_fail_status: not_ready

candidate_gate:
  requires_positive_numeric_rho: true
  solver_optimality_required_for_V3P: false
  formal_claim_before_V3P: false
  witness_hash_binds_barrier_controller_model_and_geometry: true

independent_validation:
  id: G5_EXACT_RATIONAL_PIECEWISE_ROOF_REPLAY_V3P_V1
  independent_from_legacy_V3: true
  certificate_schema_version: 3
  acceptance_tolerance: 0.0
  reads_solver_status: false
  reads_LP_matrix: false
  reads_multiplier_values: false
  rebuilds_P49_catalog_and_hash: true
  verifies_all_84_C0_edges: true
  verifies_all_1012_roof_domination_obligations: true
  verifies_all_37_integrated_drift_obligations: true
  replays_controller_action_disk_and_D1: true
  unknown: fail_closed

acceptance:
  ready:
    - V3P status == validated
    - V3P first_slice_ready == true
    - exact_binary64(q) <= 1/10
    - exact_binary64(epsbar) > 0
    - all barrier, witness, geometry, controller, model, q, epsbar, and tree hashes cross-bind
  no_numeric_solver_or_multiplier_result_is_formal_evidence: true
  publication_transaction:
    pending_filename: certificate.pending.json
    atomic_final_filename: certificate.json
    exception_cleanup_removes_pending_and_final: true
