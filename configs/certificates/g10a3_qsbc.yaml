schema_version: 1
kind: certificate_synthesis_spec
id: G4_G10A3_QSBC_V1

theorem:
  id: G4_QSBC_INFINITE_HORIZON_REACH_AVOID_V1
  unchanged: true
  obligations:
    - W >= 0 on X
    - W <= q on X0
    - W >= 1 on Xu
    - E[W_next] <= W - epsbar on Psi

frozen_inputs:
  identical_to_G10A_and_G10A2: true
  controller_id: CBF_ROVER_C2_LOWER_ROUTE_V1
  controller_content_sha256: b0cacedfcd4b884961a786b24e84b2f0f33bbc4ac81aef0b1ff1b0dcfe285984
  controller_file_sha256: df0dbfd2cc5b3aa0a049b5dbb6e7d0360c6b260801e183e95acfb7a9bccf715d
  runtime_mode: monitor_only
  certificate_evaluator_modifies_action: false

synthesis:
  id: G10A3_EXACT_RATIONAL_GRID_MULTIPOINT_LP_V1
  proof_route_id: G10A3_G65_EXACT_GRID_UNCHANGED_V3_V1
  route: independent_fallback_beside_G10A_G10A2_and_G10E
  barrier_degree: 16
  barrier_basis: normalized_total_degree_tensor_chebyshev
  barrier_coefficient_count: 153
  barrier_coefficient_bounds: [-1000.0, 1000.0]
  q:
    decimal: 0.09999999999999999
    float64_hex: 0x1.9999999999999p-4
  epsbar:
    decimal: 0.000001
    float64_hex: 0x1.0c6f7a0b5ed8dp-20
  decision_layout: [c_0_to_c_152, rho, t, z_0_to_z_152]
  rho:
    bounds: [0.0, 0.0]
    objective_coefficient: 0.0
    read_by_selected_point_rows: false
    read_by_formal_validator: false
  projection_objective:
    phase_1: minimize_max_abs_Chebyshev_coefficient_distance_to_bound_G9_seed
    phase_2: minimize_sum_abs_Chebyshev_coefficient_distance_to_bound_G9_seed
    phase_2_t_upper: nextafter(t_star,+inf)+1e-9
    pure_L1_first_objective_allowed: false
    primary_and_ephemeral_secondary_rows_use_G10A3_resource_caps: true
    resource_sample_labels_are_G10A3_specific: true
  fixed_LP_solve_count: 8
  fixed_candidate_count: 4

exact_grid_preseparation:
  catalog_id: G10A3_FIXED_RATIONAL_TENSOR_GRID_G17_G33_G65_V1
  point_formula: [x_low+i*(x_high-x_low)/(n-1), y_low+j*(y_high-y_low)/(n-1)]
  point_indices: {i: 0_to_n_minus_1, j: 0_to_n_minus_1}
  arithmetic_for_selection: exact_rational
  evaluator: common_denominator_integer_tensor_horner
  evaluator_reference_equivalence: exact_fraction_point_evaluator
  residual_spaces:
    coefficient_space: exact_binary64_Chebyshev_basis_row_dot_exact_binary64_c_plus_constant
    artifact_space: exact_rational_reconstruction_of_emitted_binary64_monomial_barrier
    preseparation_selection_uses: coefficient_space
    final_G65_gate_uses: artifact_space_only
    selected_points_bind_both_and_artifact_minus_coefficient_delta: true
  point_domain_classification: exact_zero_width_box
  outside_points_selected: false
  inside_and_boundary_points_selected: true
  numeric_margin:
    decimal: 0.00000001
    artifact_semantics: exact_binary64_rational
  stratum_assignment:
    ordinary_index: floor(index*strata_per_axis/(nodes_per_axis-1))
    final_endpoint: strata_per_axis-1
  passes:
    - id: G17_S8
      nodes_per_axis: 17
      strata_per_axis: 4
      max_new_points_per_family: 8
    - id: G33_S16
      nodes_per_axis: 33
      strata_per_axis: 8
      max_new_points_per_family: 16
    - id: G65_S32
      nodes_per_axis: 65
      strata_per_axis: 8
      max_new_points_per_family: 32
  selection:
    eligible_when_exact_residual_below_numeric_margin: true
    one_exact_worst_new_point_per_stratum_before_global_ranking: true
    global_ranking: [exact_residual, i, j]
    exact_point_dedup_across_nested_grids: true
    maximum_per_family_across_all_passes: 56
    maximum_selected_hard_point_rows: 2352
    selected_row_semantics: original_residual_at_point_greater_equal_numeric_margin
    selected_row_rho_t_z_columns_bitwise_zero: true
    candidate_row_numeric_replay: final_float64_row_at_full_candidate_minus_float64_RHS
    full_candidate_vector_dimension: 308
    full_candidate_vector_binary64_hash_required: true
    candidate_row_must_be_excluded_beyond_numeric_feasibility_tolerance: true
    exact_residual_cast_is_not_accepted_as_numeric_row_replay: true
  final_gate:
    id: G65_FINAL_GATE
    nodes_per_axis: 65
    complete_42_family_catalog_required: true
    expected_point_visits: 177450
    negative_exact_residual_allowed: false
    selects_new_rows: false
    retries_after_failure: false
  provenance:
    family_contract_binds_normalized_full_basis_coefficients: true
    expected_point_set_sha256_frozen_per_grid: true
    runtime_scanned_point_set_sha256_must_match: true
    cut_definition_binds: [family_contract, exact_point, exact_row, numeric_margin, zero_rho]
    selection_event_additionally_binds: [candidate_barrier, full_candidate_values_sha256, exact_coefficient_space_residual, exact_artifact_residual, exact_conversion_delta, numeric_candidate_violation_float64_hex, pass, grid_point_identity]
    selected_cut_ledger_self_validates_against_expected_catalog_and_frozen_families: true
    selected_cut_ledger_recomputes: [exact_grid_point, exact_row, constant, numeric_row_prefix, RHS]
    selected_cut_ledger_replays_candidate_subjects: [full_308_float64_values_and_hash, coefficient_space_residual, artifact_residual, conversion_delta, actual_float64_A_x_minus_b]
    selected_cut_ledger_trusted_state_source: in_memory_payload_returned_by_final_save
    selected_cut_ledger_first_disk_load_used_as_expected_state: false
    selected_cut_ledger_disk_reload_binds: [full_payload_equality, file_sha256, content_sha256, row_count_equals_accumulated_rows]
    publication_reloads_each_ledger_referenced_numeric_candidate: true
    candidate_disk_reload_validates: [manifest_trusted_path, file_sha256, content_sha256, barrier_sha256, full_candidate_values_sha256]
    unchanged_V3_reads_grid_or_ledger: false

resource_caps:
  aggregate_LP_wall_time_s: 1800
  aggregate_exact_grid_wall_time_s: 3600
  stage_wall_time_s: 10800
  max_RSS_bytes: 1073741824
  RSS_measurement: linux_proc_self_status_VmHWM_process_high_water_mark
  catalog_generation_point_yields: 235326
  max_candidate_scan_point_visits: 412776
  max_total_grid_point_yields: 648102
  max_selected_point_rows: 2352
  max_master_rows: 3006
  max_ephemeral_rows: 3007
  max_CSR_nonzeros: 400000
  max_decision_variables: 308
  missing_RSS_measurement: fail_closed

independent_validation:
  id: G5_EXACT_RATIONAL_BERNSTEIN_REPLAY_V3
  unchanged: true
  max_full_V3_calls: 1
  report_schema_version: 2
  acceptance_tolerance: 0.0
  reads_grid_reports: false
  reads_selected_cut_ledger: false
  reads_solver_objective_or_rho_t_z: false
  reconstructs_original_G4_polynomials: true
  report_tree_barrier_controller_q_eps_hashes_cross_bound: true

acceptance:
  ready:
    - complete final G65 exact grid gate passed
    - exact grid catalog and selected point ledger bindings passed
    - all resource and deadline gates passed
    - exactly one unchanged V3 call was executed
    - V3 schema_version == 2
    - V3 status == validated
    - V3 global_polynomial_status == validated
    - V3 first_slice_ready == true
    - V3 controller and geometry contracts == validated
    - V3 theorem_scalar_gate == true
    - V3 formal_acceptance_tolerance == 0
    - unchanged V3 release gate passed
    - all subject, tree, model, controller, q, and epsbar bindings passed
  V3_failure_retry_allowed: false
  publication_transaction:
    pre_write_peak_RSS_and_stage_deadline_gate: true
    pending_filename: certificate.pending.json
    expected_certificate_source: trusted_in_memory_object_constructed_before_write
    first_disk_load_is_never_used_as_expected_certificate: true
    expected_cut_ledger_source: trusted_in_memory_object_from_final_save
    first_disk_load_is_never_used_as_expected_cut_ledger: true
    post_write_peak_RSS_and_stage_deadline_gate: true
    immediately_pre_rename_disk_reload_gate: [pending_certificate, V3_report, all_V3_trees, all_ledger_referenced_numeric_candidates, selected_cut_ledger, exact_grid_catalog, final_G65_report]
    certificate_solver_binds: [selected_cut_ledger_file_sha256, selected_cut_ledger_content_sha256]
    pending_certificate_cross_binds: [trusted_barrier_object_and_payload, q_float64_hex, epsbar_float64_hex, controller_content_sha256, disk_V3_validation_fields_and_report_hashes]
    atomic_final_filename: certificate.json
    final_certificate_reloaded_after_atomic_rename: true
    post_commit_peak_RSS_and_stage_deadline_gate: true
    exception_cleanup_removes_pending_and_final: true
  exact_grid_is_formal_evidence: false
  numeric_LP_is_formal_evidence: false
  automatic_degree_grid_row_time_or_V3_escalation_allowed: false
  failure_status: not_ready
