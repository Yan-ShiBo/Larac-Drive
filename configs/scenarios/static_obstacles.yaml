schema_version: 3
kind: scenario_spec

scenario:
  id: P1_ROVER_STATIC_OBSTACLES_AABB_V1
  display_name: Rover static-obstacle reach-avoid
  status: confirmed_contract
  frame_id: world
  units: SI

authority:
  source_of_truth: configs/scenarios/static_obstacles.yaml
  hard_coded_geometry_outside_spec_allowed: false
  original_handover_archives_are_inputs: false

domain:
  id: D1_COMPACT_ROBUST_FORWARD_INVARIANT
  type: closed_axis_aligned_box_2d
  x_bounds_m: [-1.0, 4.0]
  y_bounds_m: [-2.0, 2.0]
  outside_successor: model_contract_breach
  clipping_projection_or_wrap_allowed: false

sets:
  initial:
    id: X0
    type: closed_disk_2d
    center_m: [0.0, 0.0]
    radius_m: 0.10
  goal:
    id: Xg
    type: closed_disk_2d
    center_m: [3.5, 0.0]
    radius_m: 0.25
  unsafe:
    union_semantics: closed_union
    components:
      - id: Xu1
        type: closed_axis_aligned_box_2d
        x_bounds_m: [0.965, 2.035]
        y_bounds_m: [-0.535, 0.535]
      - id: Xu2
        type: closed_axis_aligned_box_2d
        x_bounds_m: [1.915, 3.085]
        y_bounds_m: [0.215, 1.385]
      - id: Xu3
        type: closed_axis_aligned_box_2d
        x_bounds_m: [1.915, 3.085]
        y_bounds_m: [-1.385, -0.215]

projection:
  physical_obstacle_source:
    - id: box_1
      center_m: [1.5, 0.0, 0.40]
      size_m: [0.35, 0.35, 0.80]
    - id: box_2
      center_m: [2.5, 0.8, 0.50]
      size_m: [0.45, 0.45, 1.00]
    - id: box_3
      center_m: [2.5, -0.8, 0.50]
      size_m: [0.45, 0.45, 1.00]
  rover_circumscribed_radius_m: 0.31
  additional_safety_margin_m: 0.05
  total_inflation_radius_m: 0.36
  rule: conservative_axis_aligned_bounding_box_of_minkowski_sum
  relation: projected_Xu_is_a_superset_of_inflated_physical_obstacles

normalization:
  id: PB1_AFFINE_X_TO_UNIT_BOX
  variable_order: [xi_x, xi_y]
  xi_x:
    formula: (x_m - 1.5) / 2.5
    center_m: 1.5
    scale_m: 2.5
  xi_y:
    formula: y_m / 2.0
    center_m: 0.0
    scale_m: 2.0

episodes:
  evaluation_seeds: [1009, 2027, 3037, 4051, 5059]
  episodes_per_seed: 20
  max_steps: 2000
  horizon_s: 100.0
  max_steps_is_formal_horizon: false

claims:
  exact_backend: eligible_only_with_matching_independently_validated_artifact
  gazebo_backend: empirical_only_until_a_tracking_error_contract_is_proved
