[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbf-rover"
version = "0.2.0"
description = "Math-first obstacle-certificate research with exact and Gazebo simulation adapters."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CBF-Rover maintainers" },
]

[project.scripts]
cbf-rover = "cbf_rover.entrypoints.cli:main"
cbf-rover-research = "cbf_rover.entrypoints.research:main"

[project.optional-dependencies]
research = [
  "gymnasium>=1.0",
  "matplotlib>=3.8",
  "numpy>=2",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.13",
  "stable-baselines3>=2.5",
  "torch>=2.4",
]
learned-rgbd = [
  "h5py",
  "matplotlib",
  "numpy",
  "opencv-python",
  "Pillow",
  "PyYAML>=6",
  "torch",
]
server-dev = [
  "mosek>=11",
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cbf_rover*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/math",
]
addopts = "-ra"
markers = [
  "requires_original_archives: verifies the external immutable handover archive set",
  "research_slow: runs the declared SAC, PAC, controller, or SDP research budget",
  "server_integration: requires server-side data, artifacts, or services",
  "ros2: requires the declared ROS2 and Gazebo server environment",
]

[tool.ruff]
target-version = "py310"
line-length = 120
