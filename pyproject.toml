[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbf-rover"
version = "0.2.0"
description = "Simulation-first research code for learned barrier-like certificates and safety filtering."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CBF-Rover maintainers" },
]

[project.scripts]
cbf-rover = "cbf_rover.cli:main"

[project.optional-dependencies]
learning = [
  "h5py",
  "matplotlib",
  "numpy",
  "opencv-python",
  "Pillow",
  "PyYAML>=6",
  "torch",
]
server-dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cbf_rover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
